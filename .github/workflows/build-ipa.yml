name: Build AutoWiFi IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          find AutoWiFi -maxdepth 3 -type f | sort

      - name: Build iOS App
        run: |
          xcodebuild \
            -project AutoWiFi/AutoWiFi.xcodeproj \
            -scheme AutoWiFi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.nguyenchayshope7.autowifi

      - name: Fix App Info.plist
        run: |
          APP="build/Build/Products/Release-iphoneos/AutoWiFi.app"
          PLIST="$APP/Info.plist"

          echo "Fixing Info.plist..."

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIdentifier" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string com.nguyenchayshope7.autowifi" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleExecutable" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleExecutable string AutoWiFi" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleShortVersionString" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string 1.0" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleVersion" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string 1" \
            "$PLIST"

          echo "===== APP INFO ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST"

      - name: Check executable
        run: |
          APP="build/Build/Products/Release-iphoneos/AutoWiFi.app"

          echo "Checking executable..."

          ls -lh "$APP/AutoWiFi"

          test -f "$APP/AutoWiFi"

          echo "Executable OK"

      - name: Create IPA
        run: |
          rm -rf Payload AutoWiFi.ipa

          mkdir Payload

          cp -R \
            build/Build/Products/Release-iphoneos/AutoWiFi.app \
            Payload/AutoWiFi.app

          zip -r AutoWiFi.ipa Payload

      - name: Verify IPA
        run: |
          echo "Checking IPA..."

          unzip -l AutoWiFi.ipa

          unzip -p AutoWiFi.ipa \
            Payload/AutoWiFi.app/Info.plist \
            > /tmp/Info.plist

          echo "===== IPA INFO ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            /tmp/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            /tmp/Info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoWiFi-IPA
          path: AutoWiFi.ipa
