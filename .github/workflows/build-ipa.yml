name: Build AutoWiFi IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          find AutoWiFi -maxdepth 3 -type f | sort

      - name: Check Entitlements File
        run: |
          ENTITLEMENTS="AutoWiFi/AutoWiFi.entitlements"

          echo "===== CHECK ENTITLEMENTS FILE ====="

          if [ -f "$ENTITLEMENTS" ]; then
            echo "Entitlements file found:"
            cat "$ENTITLEMENTS"
          else
            echo "ERROR: Entitlements file not found!"
            exit 1
          fi

      - name: Build iOS App
        run: |
          xcodebuild \
            -project AutoWiFi/AutoWiFi.xcodeproj \
            -scheme AutoWiFi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.nguyenchayshope7.autowifi \
            CODE_SIGN_ENTITLEMENTS=AutoWiFi/AutoWiFi.entitlements

      - name: Check Hotspot Entitlement
        run: |
          APP="build/Build/Products/Release-iphoneos/AutoWiFi.app"

          echo "===== CHECK APP ====="

          ls -la "$APP"

          echo ""
          echo "===== CHECK ENTITLEMENTS ====="

          if [ -f "$APP/archived-expanded-entitlements.xcent" ]; then
            echo "Entitlement file found."

            /usr/libexec/PlistBuddy \
              -c "Print :com.apple.developer.networking.HotspotConfiguration" \
              "$APP/archived-expanded-entitlements.xcent" || true
          else
            echo "WARNING: archived-expanded-entitlements.xcent not found."
            echo "This can happen because the GitHub build is unsigned."
          fi

      - name: Fix App Info.plist
        run: |
          APP="build/Build/Products/Release-iphoneos/AutoWiFi.app"
          PLIST="$APP/Info.plist"

          echo "===== FIXING INFO.PLIST ====="

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIdentifier" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string com.nguyenchayshope7.autowifi" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleExecutable" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleExecutable string AutoWiFi" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleShortVersionString" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string 1.0" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleVersion" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string 1" \
            "$PLIST"

          echo ""
          echo "===== APP INFO ====="

          echo "Bundle Identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo ""
          echo "Bundle Executable:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"

          echo ""
          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST"

          echo ""
          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST"

      - name: Check executable
        run: |
          APP="build/Build/Products/Release-iphoneos/AutoWiFi.app"

          echo "===== CHECK EXECUTABLE ====="

          ls -lh "$APP/AutoWiFi"

          test -f "$APP/AutoWiFi"

          echo "Executable OK."

      - name: Create IPA
        run: |
          echo "===== CREATE IPA ====="

          rm -rf Payload AutoWiFi.ipa

          mkdir Payload

          cp -R \
            build/Build/Products/Release-iphoneos/AutoWiFi.app \
            Payload/AutoWiFi.app

          zip -r AutoWiFi.ipa Payload

          echo ""
          echo "IPA created:"
          ls -lh AutoWiFi.ipa

      - name: Verify IPA
        run: |
          echo "===== VERIFY IPA ====="

          unzip -l AutoWiFi.ipa

          unzip -p AutoWiFi.ipa \
            Payload/AutoWiFi.app/Info.plist \
            > /tmp/Info.plist

          echo ""
          echo "===== IPA INFO ====="

          echo "Bundle Identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            /tmp/Info.plist

          echo ""
          echo "Bundle Executable:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            /tmp/Info.plist

          echo ""
          echo "===== IPA STRUCTURE ====="

          unzip -l AutoWiFi.ipa | grep "Payload/AutoWiFi.app/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoWiFi-IPA
          path: AutoWiFi.ipa
